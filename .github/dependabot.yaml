version: 2

updates:
  - package-ecosystem: gomod
    directories:
      - /
      - /tests/provider/fixture
    schedule:
      interval: daily
    cooldown:
      default-days: 7
      semver-major-days: 14
      # devantler-tech Go modules are our own code — bump now, no cooldown.
      exclude:
        - "github.com/devantler-tech/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
      # devantler-tech actions/workflows are our own code — bump now, no cooldown.
      exclude:
        - "devantler-tech/*"
    groups:
      # One shared workflow release can update several pins and start a full CI run for each.
      shared-workflows:
        applies-to: version-updates
        patterns:
          - "devantler-tech/.github/.github/workflows/*"
        update-types:
          - minor
          - patch
    ignore:
      # The platform only accepts publisher revisions it has approved for this
      # consumer; move this pin by hand once devantler-tech/platform#5275 approves
      # a newer one (an automatic bump broke regeneration in #489 and #498).
      - dependency-name: "devantler-tech/.github/.github/workflows/publish-app.yaml"
