version: 2

updates:
  - package-ecosystem: gomod
    directories:
      - /
      - /tests/provider/fixture
    schedule:
      interval: daily
    cooldown:
      default-days: 7
      semver-major-days: 14
      # devantler-tech Go modules are our own code — bump now, no cooldown.
      exclude:
        - "github.com/devantler-tech/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
      # devantler-tech actions/workflows are our own code — bump now, no cooldown.
      exclude:
        - "devantler-tech/*"
    groups:
      # One shared workflow release can update several pins and start a full CI run for each.
      # The publish-app action updates like any dependency: releases are signed by this
      # repository's own cd.yaml on its tag, whatever action revision runs
      # (devantler-tech/monorepo ADR 0017), so no platform approval gates its updates.
      shared-workflows:
        applies-to: version-updates
        patterns:
          - "devantler-tech/.github/.github/workflows/*"
          - "devantler-tech/.github/actions/*"
        update-types:
          - minor
          - patch
