---
name: "TODOs"
permissions: {}
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  todos:
    permissions:
      contents: read # Scan the repository source.
      issues: write # Create and update to-do tracking issues (lowercase: the scanner files the uppercase marker).
      id-token: write # lets the shared to-do scanner prove its identity to the GitHub token broker (ADR 0020)
    uses: devantler-tech/.github/.github/workflows/scan-for-todo-comments.yaml@ad244381360efe464f8fb389bdedaaa974f52f3c # v22.7.3
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
