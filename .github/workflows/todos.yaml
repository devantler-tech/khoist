---
name: "TODOs"
permissions: {}
on:
  workflow_dispatch: # Run it from main: the GitHub token broker gives the project token only to main (ADR 0020).
  push:
    branches: [main]

jobs:
  todos:
    permissions:
      contents: read # Scan the repository source.
      issues: write # Create and update to-do tracking issues (lowercase: the scanner files the uppercase marker).
      id-token: write # lets the shared to-do scanner prove its identity to the GitHub token broker (ADR 0020)
    uses: devantler-tech/.github/.github/workflows/scan-for-todo-comments.yaml@832e6d37bfd0c0b39c855496efc128d2fdc2be2c # v22.9.0
