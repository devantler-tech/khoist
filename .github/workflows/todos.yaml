---
name: "TODOs"
permissions: {}
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  todos:
    permissions:
      contents: read # Scan the repository source.
      issues: write # Create and update to-do tracking issues (lowercase: the scanner files the uppercase marker).
    uses: devantler-tech/.github/.github/workflows/scan-for-todo-comments.yaml@84f4cddc69d6a5a937a7e83d2bd77a438d932f26 # v17.0.0
    with:
      exclude-vendored: true
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
