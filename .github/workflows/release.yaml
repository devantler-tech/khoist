name: Release
on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions: {}

jobs:
  release:
    permissions:
      contents: write # Create the release commit, tag, and GitHub release.
      id-token: write # Mint the reusable workflow's GitHub App identity.
    uses: devantler-tech/.github/.github/workflows/create-release.yaml@56ceec6717a1faa0686d865424cd2d1d45f18a0a # v20.1.6
    with:
      disable-issue-side-effects: true
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
