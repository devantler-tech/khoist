name: Release
on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions: {}

jobs:
  release:
    permissions:
      contents: write # Create the release commit, tag, and GitHub release.
      id-token: write # Mint the reusable workflow's GitHub App identity.
    uses: devantler-tech/.github/.github/workflows/create-release.yaml@f5d078cc4b04ecb15432ed4e34cba1142a6279d4 # v13.2.15
    with:
      disable-issue-side-effects: true
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
