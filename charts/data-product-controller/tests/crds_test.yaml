# The chart ships the DataProduct CRD from crds/, outside the templates.
# Ported from scripts/chart.test.sh (`helm show crds`) (#619). The byte
# comparison with the generated CRD stays in scripts/chart.test.sh.
suite: CRDs
includeCrds: true
tests:
  - it: ships the DataProduct CRD
    template: crds/data.devantler.tech_dataproducts.yaml
    asserts:
      - hasDocuments:
          count: 1
      - containsDocument:
          kind: CustomResourceDefinition
          apiVersion: apiextensions.k8s.io/v1
          name: dataproducts.data.devantler.tech
